version: '3.8'

services:
  api-gateway-1:
    build: ./api-getaway
    container_name: api-gateway-1
    networks:
      - proxy_net
    expose:
      - "3010"

  api-gateway-2:
    build: ./api-getaway
    container_name: api-gateway-2
    networks:
      - proxy_net
    expose:
      - "3010"

  api-gateway-3:
    build: ./api-getaway
    container_name: api-gateway-3
    networks:
      - proxy_net
    expose:
      - "3010"

  nginx:
    image: nginx:latest
    container_name: reverse-proxy
    ports:
      - "80:80"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway-1
      - api-gateway-2
      - api-gateway-3
    networks:
      - proxy_net

networks:
  proxy_net:
    driver: bridge
